[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "novel_generator"
version = "2.0.0"
description = "ASP 模板流小说自动生成引擎 —— 多层嵌套循环 + 词库随机替换"
authors = [{name = "ASP Team"}]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
novel-gen = "novel_generator.unified_engine:main"

[tool.setuptools.packages.find]
include = ["novel_generator*"]
